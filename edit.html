<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자막 수정실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.2/dist/galmuri.css">
<style>
/* 자막 수정용 화면: 왼쪽 장면 목록 / 가운데 영상+타임라인 / 오른쪽 자막 편집 */
:root{
  --bg:#0f1213; --panel:#171b1c; --panel2:#1e2324; --line:#2b3233; --fg:#eef2f1; --muted:#98a4a2;
  --teal:#3fb8b0; --orange:#ff8a3d; --red:#ff5a5a;
  --font:"Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--teal);border-color:var(--teal);color:#062523;font-weight:700}
button.danger:hover{border-color:var(--red);color:var(--red)}
input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--teal)}
textarea{resize:vertical;min-height:38px;line-height:1.5}

.app{display:grid;grid-template-columns:230px 1fr 400px;grid-template-rows:52px 1fr;height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0}
header .sp{flex:1}
#status{font-size:13px;color:var(--muted)}
#status.dirty{color:var(--orange)}

nav{border-right:1px solid var(--line);overflow:auto;padding:10px}
nav h3{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:14px 6px 6px}
nav button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:6px;align-items:center}
nav button:hover{background:var(--panel2)}
nav button.on{background:var(--panel2);box-shadow:inset 3px 0 var(--teal)}
nav .wheel button.on{box-shadow:inset 3px 0 var(--orange)}
nav .tag{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--line);color:var(--muted);flex:none}
nav .tag.v{background:#1d3a38;color:var(--teal)}
nav .n{font-size:11px;color:var(--muted);margin-left:auto}

main{display:flex;flex-direction:column;min-width:0;padding:14px;gap:10px;overflow:auto}
.stage{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9;max-height:62vh}
video{width:100%;height:100%;object-fit:contain;display:block}
/* 본편과 같은 자막·위치 자막 모양(미리보기) */
#sub{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);text-align:center;max-width:calc(100% - 32px);pointer-events:none;display:none}
/* 미리보기: 본편과 같은 픽셀 대화창 */
#sub,#loc{font-family:"Galmuri11",var(--font);font-weight:700}
#sub{text-align:left}
#sub span{position:relative;display:block;font-size:clamp(12px,1.05vw,15px);font-weight:700;line-height:1.6;padding:7px 30px 7px 14px;background:#fff;color:#2a2140;
  box-shadow:0 -3px 0 0 #2a2140,0 3px 0 0 #2a2140,-3px 0 0 0 #2a2140,3px 0 0 0 #2a2140,inset 0 -3px 0 0 rgba(42,33,64,.15),3px 6px 0 0 rgba(0,0,0,.35)}
#sub span::after{content:"▼";position:absolute;right:10px;bottom:5px;font-size:9px}
#sub.late span{color:#d42020}
#loc{position:absolute;left:14px;top:14px;display:flex;pointer-events:none}
#loc i{font-style:normal;font-size:11px;font-weight:700;color:var(--teal);margin-right:8px;text-shadow:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000}
#loc b{font-size:12px;font-weight:700;color:#fff;text-shadow:2px 0 0 #000,-2px 0 0 #000,0 2px 0 #000,0 -2px 0 #000}
.wheel #loc i{color:var(--orange)}

.bar{display:flex;align-items:center;gap:10px}
#time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:110px}
/* 타임라인: 자막 블록이 시간 위치에 표시됨 */
.tl{position:relative;height:44px;background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer;user-select:none}
.tl .cue{position:absolute;top:6px;height:30px;background:rgba(63,184,176,.25);border:1px solid var(--teal);border-radius:5px;
  font-size:11px;padding:2px 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tl .cue.sel{background:rgba(63,184,176,.55)}
.tl .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);pointer-events:none}
.hint{color:var(--muted);font-size:12px;line-height:1.6}
.hint kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px}
.flow{color:var(--muted);font-size:12px}

aside{border-left:1px solid var(--line);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
aside h2{font-size:16px;margin:0}
aside label{display:grid;gap:5px;font-size:12px;color:var(--muted)}
.cues{display:grid;gap:8px}
.cuebox{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px;display:grid;gap:7px}
.cuebox.sel{border-color:var(--teal)}
.cuebox .row{display:flex;gap:6px;align-items:center}
.cuebox .row input{width:72px;padding:5px 7px}
.cuebox .row span{font-size:12px;color:var(--muted)}
.cuebox .row .sp{flex:1}
.cuebox button{padding:4px 8px;font-size:12px}
.empty{color:var(--muted);font-size:13px;padding:10px;border:1px dashed var(--line);border-radius:8px;text-align:center}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>✍️ 자막 수정실</h1>
    <a href="index.html" target="_blank" style="color:var(--muted);font-size:13px">본편 열기 ↗</a>
    <span class="sp"></span>
    <span id="status">저장됨</span>
    <button id="dl">JSON 내려받기</button>
    <button class="primary" id="save">저장 (⌘S)</button>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
  <aside id="side"></aside>
</div>

<script src="flow.js"></script>
<script>
const $ = s => document.querySelector(s);
let SUBS = {}, cur = null, sel = -1, dirty = false;
const S = id => (SUBS[id] ??= {});
const r1 = x => Math.round(x * 10) / 10;
const fmt = s => `${Math.floor(s/60)}:${(s%60).toFixed(1).padStart(4,'0')}`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 고친 내용은 이 브라우저에 임시 저장(창을 닫아도 남음)
const DRAFT = 'subs_draft';
let BASE = '';   // 불러온 subs.json 원본 (임시저장이 이 버전에서 만든 건지 확인용)
function keepDraft(){ try { localStorage.setItem(DRAFT, JSON.stringify({base: BASE, subs: SUBS})); } catch {} }
function setDirty(d){ dirty = d; if (d) keepDraft(); $('#status').textContent = d ? '● 저장 안 됨' : '저장됨'; $('#status').className = d ? 'dirty' : ''; }

// 흐름 순서대로 장면 목록 만들기
function order(startId){
  const seen = [], q = [startId];
  while (q.length){
    const id = q.shift();
    if (!G[id] || seen.includes(id)) continue;
    seen.push(id);
    const n = G[id];
    if (n.opts) n.opts.forEach(([, to]) => q.push(to));
    if (n.next) q.push(n.next);
  }
  return seen;
}
function buildNav(){
  const part = (title, ids, cls) => `<div class="${cls}"><h3>${title}</h3>${ids.map(id => {
    const n = G[id], t = {video:'영상', choice:'선택', card:'카드'}[n.t];
    const name = n.t === 'video' ? (S(id).loc ?? n.label) : n.t === 'choice' ? (S(id).q ?? n.q) : (S(id).title ?? n.title);
    const cnt = n.t === 'video' ? `<span class="n">${(S(id).cues || []).length}</span>` : '';
    return `<button data-id="${id}" class="${id === cur ? 'on' : ''}"><span class="tag ${n.t === 'video' ? 'v' : ''}">${t}</span>${esc(name)}${cnt}</button>`;
  }).join('')}</div>`;
  $('#nav').innerHTML = part('1부 · 비장애 학생', order('w01'), 'walk') + part('2부 · 휠체어 이용 학생', order('h01'), 'wheel');
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => open(b.dataset.id));
}

function open(id){
  cur = id; sel = -1;
  const n = G[id];
  $('#app').classList.toggle('wheel', id.startsWith('h'));
  buildNav();
  const nextTxt = n.next ? `다음 → ${n.next}` : n.opts ? n.opts.map(([l, to]) => `${l} → ${to === 'X' ? '이동 불가' : to}`).join(' / ') : '';
  if (n.t === 'video'){
    $('#main').innerHTML = `
      <div class="stage"><video id="v" src="videos/${n.src}.mp4" muted playsinline preload="auto"></video>
        <div id="loc"><i>${n.p}교시</i><b></b></div><div id="sub"><span></span></div></div>
      <div class="bar"><button id="pp">▶ 재생</button><span id="time">0:00.0 / 0:00.0</span>
        <button id="add" class="primary">+ 지금 위치에 자막 추가 (A)</button><span class="sp" style="flex:1"></span><span class="flow">${id} · ${nextTxt}</span></div>
      <div class="tl" id="tl"><div class="ph" id="ph"></div></div>
      <p class="hint"><kbd>Space</kbd> 재생/정지 · <kbd>←</kbd><kbd>→</kbd> 0.5초 이동 · <kbd>A</kbd> 지금 위치에 자막 추가 · 타임라인 클릭 = 그 위치로 이동 · 자막 블록 클릭 = 선택<br>
      시작·길이는 초 단위(소수점 1자리). 자막이 ✅로 시작하면 초록 배경으로 나와.</p>`;
    const v = $('#v');
    v.onloadedmetadata = () => { drawTL(); tick(); };
    v.ontimeupdate = tick;
    v.onplay = () => $('#pp').textContent = '❚❚ 정지';
    v.onpause = () => $('#pp').textContent = '▶ 재생';
    $('#pp').onclick = () => v.paused ? v.play() : v.pause();
    $('#add').onclick = addCue;
    $('#tl').onclick = e => {
      const c = e.target.closest('.cue');
      if (c){ selectCue(+c.dataset.i, true); return; }
      const r = $('#tl').getBoundingClientRect();
      v.currentTime = (e.clientX - r.left) / r.width * v.duration;
    };
  } else {
    $('#main').innerHTML = `<div class="empty" style="margin:auto;max-width:420px">${n.t === 'choice' ? '선택지 화면이야. 오른쪽에서 질문과 버튼 문구를 고칠 수 있어.' : '교시 종료 카드야. 오른쪽에서 제목과 설명을 고칠 수 있어.'}<br><br><span class="flow">${id} · ${nextTxt}</span></div>`;
  }
  drawSide();
}

function drawSide(){
  const n = G[cur], s = S(cur);
  if (n.t === 'video'){
    const cues = s.cues || [];
    $('#side').innerHTML = `<h2>${n.p}교시 · 영상 ${cur}</h2>
      <label>위치 자막 (왼쪽 위 장소 표시)<input id="loc_in" value="${esc(s.loc ?? n.label)}"></label>
      <h2 style="font-size:14px">자막 ${cues.length}개</h2>
      <div class="cues">${cues.length ? cues.map((c, i) => `
        <div class="cuebox ${i === sel ? 'sel' : ''}" data-i="${i}">
          <div class="row"><span>시작</span><input type="number" step="0.1" min="0" data-k="t" value="${c.t}">
            <span>길이</span><input type="number" step="0.1" min="0.3" data-k="d" value="${c.d}">
            <span class="sp"></span><button data-act="go" title="이 자막으로 이동">▶</button><button data-act="now" title="시작을 지금 위치로">⏱ 지금</button><button class="danger" data-act="del">삭제</button></div>
          <textarea data-k="text" rows="2">${esc(c.text)}</textarea>
        </div>`).join('') : '<div class="empty">자막이 없어. 영상을 원하는 곳에 멈추고 "+ 지금 위치에 자막 추가"를 눌러 줘.</div>'}</div>`;
    $('#loc_in').oninput = e => { s.loc = e.target.value; setDirty(true); tick(); };
    $('#side').querySelectorAll('.cuebox').forEach(box => {
      const i = +box.dataset.i;
      box.onfocusin = () => selectCue(i, false);
      box.querySelectorAll('[data-k]').forEach(el => el.oninput = () => {
        const k = el.dataset.k;
        cues[i][k] = k === 'text' ? el.value : r1(+el.value || 0);
        setDirty(true); drawTL(); tick();
      });
      box.querySelector('[data-act=go]').onclick = () => { $('#v').currentTime = cues[i].t; selectCue(i, false); };
      box.querySelector('[data-act=now]').onclick = () => { cues[i].t = r1($('#v').currentTime); sortCues(); setDirty(true); drawSide(); drawTL(); };
      box.querySelector('[data-act=del]').onclick = () => { cues.splice(i, 1); sel = -1; setDirty(true); drawSide(); drawTL(); buildNav(); };
    });
  } else if (n.t === 'choice'){
    $('#side').innerHTML = `<h2>선택지 ${cur}</h2>
      <label>질문<textarea id="q_in" rows="2">${esc(s.q ?? n.q)}</textarea></label>
      ${n.opts.map(([l, to], i) => `<label>버튼 ${'AB'[i]} ${to === 'X' ? '(누르면 이동 불가 화면)' : '→ ' + to}<input data-i="${i}" class="opt_in" value="${esc(s.opts?.[i] ?? l)}"></label>`).join('')}`;
    $('#q_in').oninput = e => { s.q = e.target.value; setDirty(true); };
    $('#side').querySelectorAll('.opt_in').forEach(el => el.oninput = () => {
      s.opts ??= n.opts.map(([l]) => l); s.opts[+el.dataset.i] = el.value; setDirty(true);
    });
  } else {
    $('#side').innerHTML = `<h2>카드 ${cur}</h2>
      <label>제목<input id="t_in" value="${esc(s.title ?? n.title)}"></label>
      <label>설명<input id="s_in" value="${esc(s.sub ?? n.sub)}"></label>`;
    $('#t_in').oninput = e => { s.title = e.target.value; setDirty(true); };
    $('#s_in').oninput = e => { s.sub = e.target.value; setDirty(true); };
  }
}

function sortCues(){ const c = S(cur).cues; if (c) c.sort((a, b) => a.t - b.t); }
function addCue(){
  const v = $('#v'), s = S(cur);
  s.cues ??= [];
  const t = r1(v.currentTime);
  s.cues.push({t, d:3, text:'새 자막'});
  sortCues();
  sel = s.cues.findIndex(c => c.t === t && c.text === '새 자막');
  setDirty(true); drawSide(); drawTL(); buildNav();
  const ta = $(`.cuebox[data-i="${sel}"] textarea`); ta && (ta.focus(), ta.select());
}
function selectCue(i, focus){
  sel = i;
  document.querySelectorAll('.cuebox').forEach(b => b.classList.toggle('sel', +b.dataset.i === i));
  document.querySelectorAll('.tl .cue').forEach(b => b.classList.toggle('sel', +b.dataset.i === i));
  if (focus){
    const v = $('#v'); v.currentTime = S(cur).cues[i].t;
    const box = $(`.cuebox[data-i="${i}"]`); box && box.scrollIntoView({block:'nearest'});
  }
}
function drawTL(){
  const v = $('#v'); if (!v || !v.duration) return;
  const tl = $('#tl');
  tl.querySelectorAll('.cue').forEach(e => e.remove());
  (S(cur).cues || []).forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'cue' + (i === sel ? ' sel' : ''); d.dataset.i = i;
    d.style.left = c.t / v.duration * 100 + '%';
    d.style.width = Math.max(.6, c.d / v.duration * 100) + '%';
    d.textContent = c.text; d.title = `${fmt(c.t)} · ${c.text}`;
    tl.appendChild(d);
  });
}
// 재생 위치에 맞춰 미리보기 자막·재생 헤드 갱신
function tick(){
  const v = $('#v'); if (!v) return;
  const n = G[cur], s = S(cur), t = v.currentTime;
  $('#time').textContent = `${fmt(t)} / ${fmt(v.duration || 0)}`;
  if (v.duration) $('#ph').style.left = t / v.duration * 100 + '%';
  $('#loc b').textContent = s.loc ?? n.label;
  const c = (s.cues || []).find(c => t >= c.t && t < c.t + c.d);
  $('#sub').style.display = c ? 'block' : 'none';
  if (c){ $('#sub span').textContent = c.text; $('#sub').className = c.text.startsWith('✅') ? 'good' : c.text.startsWith('⏰') ? 'late' : ''; }
}
setInterval(() => { const v = $('#v'); if (v && !v.paused) tick(); }, 100);

async function save(){
  try {
    const r = await fetch('/api/subs', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(SUBS)});
    if (!r.ok) throw 0;
    setDirty(false);
    try { localStorage.removeItem(DRAFT); } catch {}
  } catch {
    // 온라인 링크에서는 서버가 없어서 바로 저장이 안 됨 → 파일로 받아서 전달
    download();
    $('#status').textContent = '온라인에선 바로 저장 안 돼서 subs.json 파일로 받았어 → 이 파일 보내줘 (고친 내용은 이 브라우저에도 남아 있음)';
    $('#status').className = 'dirty';
  }
}
$('#save').onclick = save;
function download(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(SUBS, null, 1)], {type:'application/json'}));
  a.download = 'subs.json'; a.click();
}
$('#dl').onclick = download;
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's'){ e.preventDefault(); return save(); }
  if (e.target.matches('input,textarea')) return;
  const v = $('#v'); if (!v) return;
  if (e.code === 'Space'){ e.preventDefault(); v.paused ? v.play() : v.pause(); }
  if (e.code === 'ArrowLeft') v.currentTime = Math.max(0, v.currentTime - .5);
  if (e.code === 'ArrowRight') v.currentTime = Math.min(v.duration, v.currentTime + .5);
  if (e.code === 'KeyA'){ e.preventDefault(); addCue(); }
});
window.onbeforeunload = () => dirty ? '' : undefined;

fetch('subs.json', {cache:'no-store'}).then(r => r.json()).then(d => { SUBS = d; BASE = JSON.stringify(d); }).catch(() => {}).finally(() => {
  // 임시저장은 지금 subs.json과 같은 버전에서 만든 것만 불러옴 (옛날 버전으로 덮어쓰기 방지)
  let draft = null; try { draft = JSON.parse(localStorage.getItem(DRAFT)); } catch {}
  if (draft && draft.base === BASE && draft.subs){ SUBS = draft.subs; } else { draft = null; try { localStorage.removeItem(DRAFT); } catch {} }
  open('w01');
  if (draft){ setDirty(true); $('#status').textContent = '● 전에 고치던 내용 불러옴 (아직 저장 안 됨)'; }
});
</script>
</body>
</html>
